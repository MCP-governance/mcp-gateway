# B 직접: MCP 서버는 MINT 동기화가 원래 주소로 등록하고(MINT_LITELLM_ROUTE=direct), 호출 직전에 이 가드레일이 MINT 판정을 받는다.
# mint_guardrail.py를 이 파일과 같은 폴더에 두고 MINT_GATEWAY_URL·MINT_CA_FILE을 준다.
# 직원은 x-litellm-api-key와 Authorization: Bearer <본인 MINT 토큰>을 보낸다.
model_list: []

guardrails:
  - guardrail_name: mint
    litellm_params:
      guardrail: mint_guardrail.MintGuardrail
      mode: pre_mcp_call
      default_on: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  require_key_mcp_access_defined: true
  store_prompts_in_spend_logs: false

litellm_settings:
  telemetry: false
