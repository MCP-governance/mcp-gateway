[project]
name = "mcp-gateway-architecture"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.141.1", "uvicorn==0.52.4", "httpx==0.28.1", "mcp==2.2.0", "psycopg[binary]==3.3.5", "psycopg-pool==3.3.1", "PyJWT[crypto]>=2.10,<3", "opentelemetry-sdk==1.44.0", "opentelemetry-exporter-otlp-proto-http==1.44.0"]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "pyflakes>=3,<4", "PyYAML>=6,<7"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
