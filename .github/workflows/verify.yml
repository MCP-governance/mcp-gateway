name: Architecture verification
on:
  push:
    branches: ["architecture/plan-1", "architecture/plan-2"]
  pull_request:
    branches: ["architecture/plan-1", "architecture/plan-2"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.24"
      - run: uv sync --frozen
      - run: uv run --frozen python -m pyflakes services tests prepare.py
      - run: uv run --frozen pytest -q
      - run: cp .env.example .env && python3 prepare.py && docker compose config --quiet
      - run: docker compose -p architecture-ci up -d --build --wait --wait-timeout 180
      - run: uv run --frozen python tests/container_smoke.py
      - if: github.ref == 'refs/heads/architecture/plan-2'
        run: docker compose -p architecture-ci --profile scan run --rm trivy && uv run --frozen python tests/container_scan_smoke.py --trivy
      - if: always()
        run: docker compose -p architecture-ci logs --tail=40 && docker compose -p architecture-ci down -v
