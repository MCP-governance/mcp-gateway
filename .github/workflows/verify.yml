# The completion criteria in full_stack_lab/README.md are only real if something
# runs them. Until now only CodeQL ran in CI and ./console.sh test was manual, so a
# regression in the policy, the drift detection or the fail-closed path could sit
# on main unnoticed until someone remembered to run it.
name: full_stack_lab 검증

on:
  push:
    branches: ["main", "feat/**", "release/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: 정적 검사
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Python lint
        run: |
          python -m pip install --quiet pyflakes
          python -m pyflakes full_stack_lab/gateway/app/*.py full_stack_lab/tests/*.py full_stack_lab/mock_server/*.py full_stack_lab/supply_chain/*.py full_stack_lab/endpoint/*.py

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: 콘솔 문법과 상태 회귀 검사
        run: |
          node --check full_stack_lab/gateway/app/agent_static/console.js
          node --check full_stack_lab/gateway/app/agent_static/login.js
          node --test full_stack_lab/tests/console-state.test.mjs

      - name: Shell 문법
        run: bash -n full_stack_lab/console.sh full_stack_lab/run-native.sh full_stack_lab/tests/drift_and_fail_closed.sh

      # README 13절은 "무엇을 의도적으로 열어두었는가"라는 진술입니다. 엔드포인트를
      # 추가하면서 그 문장을 건드리지 않는 순간 목록이 어긋나고, 불완전한 목록은
      # 없는 것보다 나쁩니다. 검토자는 그 목록을 전부라고 읽습니다.
      - name: 무인증 API 목록과 문서 대조
        run: python3 full_stack_lab/tests/open_endpoints.py

      - name: Compose 구성 검증
        working-directory: full_stack_lab
        env:
          AGENT_JWT_PRIVATE_KEY: ci-placeholder
          AGENT_JWT_PUBLIC_KEY: ci-placeholder
        run: docker compose config --quiet

      - name: 내부망과 게시 포트 검증
        working-directory: full_stack_lab
        env:
          AGENT_JWT_PRIVATE_KEY: ci-placeholder
          AGENT_JWT_PUBLIC_KEY: ci-placeholder
        run: |
          docker compose -f compose.yaml -f compose.corporate-lab.yaml -f compose.local-llm.yaml \
            --profile local-llm --profile local-llm-download config --format json > /tmp/mcp-compose.json
          python3 - <<'PY'
          import json
          stack = json.load(open('/tmp/mcp-compose.json'))
          services = stack['services']
          assert stack['networks']['model']['internal'] is True
          assert set(services['ollama']['networks']) == {'model'}
          assert set(services['ollama-pull']['networks']) == {'scanner'}
          assert not services['ollama'].get('ports')
          assert 'tools' not in services['agent-service']['networks']
          assert services['intake-worker']['environment']['MCP_SCAN_AUTO_JOBS'] == '0'
          assert services['intake-worker']['environment']['MCP_SCAN_RESCAN_DAYS'] == '0'
          for name in ('gateway', 'agent-service', 'jaeger'):
              assert services[name]['ports'] and all(port['host_ip'] == '127.0.0.1' for port in services[name]['ports'])
          print('PASS internal model, upstream and loopback boundaries')
          PY

      # The trust boundary is only real if the key material says so. A verifier that
      # receives the signing key can mint an admin session for itself.
      - name: 검증자는 서명 개인키를 받지 않는지 확인
        working-directory: full_stack_lab
        env:
          AGENT_JWT_PRIVATE_KEY: ci-placeholder
          AGENT_JWT_PUBLIC_KEY: ci-placeholder
        run: |
          docker compose config --format json > /tmp/compose.json
          python3 - <<'PY'
          import json, sys
          services = json.load(open("/tmp/compose.json"))["services"]
          issuers, leaked = [], []
          for name, service in services.items():
              env = service.get("environment") or {}
              names = set(env) if isinstance(env, dict) else {item.split("=", 1)[0] for item in env}
              if "AGENT_JWT_PRIVATE_KEY" in names:
                  (issuers if name == "agent-service" else leaked).append(name)
          if leaked:
              sys.exit(f"FAIL 검증자가 서명 개인키를 받습니다: {leaked}")
          if not issuers:
              sys.exit("FAIL 발급자(agent-service)가 서명 개인키를 받지 않습니다")
          print("PASS 발급자만 개인키를 보유합니다")
          PY

      # 엔드포인트 에이전트는 의존성 없는 단일 파일이라 CI에서 그대로 돌릴 수
      # 있다. 분류·탐색범위 로직이 깨지면 여기서 먼저 걸린다.
      - name: 엔드포인트 에이전트 자체 점검
        run: python3 full_stack_lab/endpoint/endpoint_agent.py --self-check

      - name: Rego 단위 테스트
        run: docker run --rm -v "$PWD/full_stack_lab/opa:/policy:ro" openpolicyagent/opa:1.20.2-static test /policy -v

  verify:
    name: 완료 조건 전체 검증
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Builds the images, waits for readiness, then runs the Rego unit tests,
      # acceptance, the Agent/API boundary acceptance and the drift + fail-closed
      # regression - the same single entry point a person uses locally.
      - name: ./console.sh test
        working-directory: full_stack_lab
        run: ./console.sh test

      - name: 실패 시 컨테이너 로그
        if: failure()
        working-directory: full_stack_lab
        run: docker compose logs --tail=300 --no-color

      - name: 증적 업로드
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: full_stack_lab/reports/
          if-no-files-found: warn
          retention-days: 14

      - name: 정리
        if: always()
        working-directory: full_stack_lab
        run: docker compose --profile endpoint --profile llm-stub down -v
