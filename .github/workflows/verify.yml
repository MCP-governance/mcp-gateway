# The completion criteria are only real if something runs them. `static` needs no
# running stack; `verify` brings the whole lab up (without the local LLM - the harnesses
# are checked with `mcp list`, the workday runs its scripted mode through the MCP
# Inspector CLI) and runs the same `./console.sh test` a person runs.
name: full_stack_lab 검증

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the workflow present for required checks; event-level paths-ignore leaves them pending.
  changes:
    name: 변경 경로 판정
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: PR 문서 전용 변경 판정
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" != pull_request ]]; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
          elif git diff --no-renames --name-only -z "$BASE_SHA" HEAD > /tmp/ci-paths; then
            python3 .github/ci/changes.py < /tmp/ci-paths >> "$GITHUB_OUTPUT"
          else
            echo 'code=true' >> "$GITHUB_OUTPUT"
          fi

  static:
    name: 정적 검사
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: full_stack_lab
    env:
      # docker compose refuses to render without these. Set only here: in `verify`
      # ./console.sh generates the real ones into .env, and a variable present in
      # the environment - even empty - would override .env.
      AGENT_JWT_PRIVATE_KEY: ci-placeholder
      AGENT_JWT_PUBLIC_KEY: ci-placeholder
      LITELLM_MASTER_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Python lint
        run: |
          python -m pip install --quiet pyflakes
          python -m pyflakes gateway/app/*.py tests/*.py supply_chain/*.py workstation/*.py workstation/managed/*.py \
            workstation/bin/bob-sso workstation/bin/workday workstation/bin/harness-check corp/*.py scripts/*.py \
            ../endpoint-agent/*.py field/pc/mcpgw_pc.py

      - name: 중첩 풀 연결 검사
        run: python tests/nested_tx_check.py

      # console.js is an ES module (it imports console-state.mjs); Node 22+ parses it with --check.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Shell·JS 문법과 콘솔 상태 테스트
        run: |
          node --test ../.github/ci/compose-cache.test.cjs
          python3 ../.github/ci/changes_test.py
          bash -n console.sh tests/security_regression.sh workstation/entrypoint.sh workstation/bin/bob-ask mcp/run-server.sh corp/gitea-entrypoint.sh ../endpoint-agent/install-linux.sh
          node --check gateway/app/agent_static/console.js
          node --check gateway/app/agent_static/charts.mjs
          node --check gateway/app/agent_static/login.js
          node --check gateway/app/agent_static/signup.js
          node --test tests/*.test.mjs tests/intake_one_click_ui_check.mjs tests/intake_d189_ui_check.mjs

      - name: 검사기 자체 점검
        run: |
          python3 tests/run_local_suite.py --inventory
          python3 tests/contracts_check.py
          python3 tests/schema_check.py
          python3 tests/experiments_check.py
          python3 tests/replay_check.py
          python3 ../endpoint-agent/agent.py --self-check
          python3 scripts/network_prefix.py --self-check
          python3 gateway/app/poisoning.py
          python3 supply_chain/exit_terms.py
          # The four harness configs are rendered from the registry; every server must land in each.
          # D-124: a managed URL must be HTTPS; the isolated lab address is the one allowed exception.
          python3 workstation/managed/render.py registry/catalog.toml /tmp/managed --gateway-url http://gateway:8080/mcp
          for u in http://evil:8080/mcp ''; do
            rc=0; python3 workstation/managed/render.py registry/catalog.toml /tmp/reject --gateway-url "$u" >/tmp/reject.log 2>&1 || rc=$?
            test "$rc" -eq 2 && grep -Fxq 'render.py: error: managed MCP URL requires HTTPS' /tmp/reject.log
          done
          python3 - <<'PY'
          import json, tomllib
          servers = sorted(tomllib.load(open("registry/catalog.toml", "rb"))["servers"])
          got = {
              "claude": sorted(json.load(open("/tmp/managed/claude-code/managed-mcp.json"))["mcpServers"]),
              "codex": sorted(tomllib.load(open("/tmp/managed/codex/config.toml", "rb"))["mcp_servers"]),
              "gemini": sorted(json.load(open("/tmp/managed/gemini-cli/settings.json"))["mcpServers"]),
              "opencode": sorted(json.load(open("/tmp/managed/opencode/opencode.json"))["mcp"]),
          }
          bad = {k: v for k, v in got.items() if v != servers}
          assert not bad, f"관리형 하네스 설정의 서버 목록이 레지스트리와 다름: {bad}"
          print(f"PASS 하네스 4종 × 서버 {len(servers)}개")
          PY

      # The README lists what is deliberately open. A list that silently falls behind
      # the code is worse than none: a reviewer reads it as exhaustive.
      - name: 무인증 API 목록과 문서 대조
        run: python3 tests/open_endpoints.py

      # The console is a product screen edited by more than one person; docs/ai/CONSOLE_UI.md
      # forbids development traces, abbreviations, ~요 style and inline style. Checked here, not on the device.
      - name: 콘솔 화면 문구 규칙
        run: python3 tests/console_copy_check.py

      # 실기기 배치(field deploy): 키트·렌더러 일반화·Caddy 오버레이. 엔진 없이 된다.
      - name: 실기기 배치 키트·오버레이 검사
        run: |
          python3 tests/field_kit_check.py
          python3 tests/managed_enforcement_check.py
          python3 tests/managed_policy_gap_check.py
      - name: 시스템 자원·연결 지표와 관리자 경계
        run: |
          python -m pip install --quiet -r gateway/requirements.txt
          PYTHONPATH=gateway REGISTRY_DIR="$PWD/registry" python -m app.integrations
          python3 tests/acceptance_identity_check.py
          python3 tests/acceptance_tls_check.py
          python3 tests/acceptance_w7_check.py
          python3 tests/fixture_mcp_identity_test.py
          python3 tests/system_metrics_check.py
          python3 tests/catalog_refresh_check.py
          python3 tests/oauth_rotation_check.py
          python3 tests/security_edges_check.py
          python3 tests/endpoint_inventory_check.py
          python3 tests/mcp_result_contract_check.py
          python3 integrations/litellm/check_preflight.py

      - name: 망 분리·게시 포트·서명 키 경계
        run: |
          docker compose --profile llm --profile llm-download config --format json > /tmp/compose.json
          python3 - <<'PY'
          import json, sys
          stack = json.load(open("/tmp/compose.json"))
          services, networks = stack["services"], stack["networks"]
          fail = []
          for name in ("office", "tools", "corp", "data", "policy", "privacy", "model"):
              if not networks[name].get("internal"):
                  fail.append(f"{name} 망이 internal이 아님")
          # D-24: every network has its own subnet under MCP_NET_PREFIX, so several labs
          # on one host do not draw from (and exhaust) Docker's default pools.
          for name, net in networks.items():
              if not (net.get("ipam") or {}).get("config"):
                  fail.append(f"{name} 망에 명시한 대역이 없음")
          for name, svc in services.items():
              nets = set(svc.get("networks") or {})
              for port in svc.get("ports") or []:
                  if port.get("host_ip") != "127.0.0.1":
                      fail.append(f"{name}: loopback 밖에 게시 {port}")
              if name.startswith("ws-") and nets != {"office"}:
                  fail.append(f"{name}: 직원 PC가 office 밖 망에 연결 {sorted(nets)}")
              if name.startswith("mcp-") and (svc.get("ports") or "office" in nets):
                  fail.append(f"{name}: MCP 서버가 호스트나 office 망에 노출")
              if name.startswith("presidio-") and (svc.get("ports") or nets != {"privacy"}):
                  fail.append(f"{name}: Presidio가 privacy 망 밖에 노출 {sorted(nets)}")
              if "privacy" in nets and not (name.startswith("presidio-") or name in ("gateway", "gateway-sse")):
                  fail.append(f"{name}: Gateway가 아닌데 privacy 망에 연결")
              env = svc.get("environment") or {}
              if "AGENT_JWT_PRIVATE_KEY" in env and name != "agent-service":
                  fail.append(f"{name}: 발급자가 아닌데 서명 개인키를 받음")
          if "tools" in (services["agent-service"].get("networks") or {}):
              fail.append("agent-service가 tools 망에 연결")
          if set(services["ollama"].get("networks") or {}) != {"model"}:
              fail.append("ollama가 model 망 밖에 연결")
          if fail:
              sys.exit("FAIL\n" + "\n".join(fail))
          print(f"PASS {len(services)}개 서비스의 망·포트·키 경계")
          PY

      # 고객에게 가는 판본·배포 묶음·문서는 판본 고정과 위생 규칙을 지킨다(deploy/check.py).
      # 비밀은 gitleaks(게이트웨이 이미지와 같은 판본)가 작업 트리 전체를 본다. 의도적 가짜 자격 경로는 .gitleaks.toml.
      - name: 릴리스 판본·배포 묶음·비밀 스캔
        run: |
          python3 ../deploy/check.py
          bash -n ../deploy/mint.sh ../deploy/install.sh
          docker run --rm -v "$PWD/..:/repo:ro" zricethezav/gitleaks:v8.30.1 dir /repo --config /repo/.gitleaks.toml --redact --no-banner

      - name: Rego 단위 테스트
        run: docker run --rm --entrypoint /opa -v "$PWD/opa:/policy:ro" openpolicyagent/opa:1.20.2-static test /policy -v

      - name: 콘솔 TLS 세 방식·게시 경계 검사
        run: |
          bash -n field/console-tls.sh
          python3 tests/console_https_check.py --docker

  local-suite:
    name: 스택 없는 시험
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OTEL_SDK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 기존 시험 의존성 설치
        run: python -m pip install --quiet -r full_stack_lab/gateway/requirements.txt
      - name: 스택 없는 전체 회귀
        run: python full_stack_lab/tests/run_local_suite.py --out local-suite.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: local-suite
          path: local-suite.json
          if-no-files-found: error
          retention-days: 14

  pg-suite:
    name: PostgreSQL 시험
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mcp
          POSTGRES_PASSWORD: ci-disposable
          POSTGRES_DB: postgres
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U mcp -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
      gitea:
        image: gitea/gitea:1.27.3-rootless
        env:
          GITEA__security__INSTALL_LOCK: "true"
          GITEA__database__DB_TYPE: sqlite3
          GITEA__server__ROOT_URL: http://127.0.0.1:3000/
          GITEA__service__DISABLE_REGISTRATION: "true"
        ports:
          - 127.0.0.1:3000:3000
    env:
      DATABASE_URL: postgresql://mcp:ci-disposable@127.0.0.1:5432/postgres
      OPA_URL: http://127.0.0.1:8181/v1/data/mcp/authz/decision
      POLICY_LEDGER_URL: http://127.0.0.1:8181/v1/data/policy_ledger
      GITEA_ADMIN_URL: http://127.0.0.1:3000
      GITEA_ADMIN_USER: corpadmin
      GITEA_ADMIN_PASSWORD: ci-disposable
      OTEL_SDK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 기존 시험 의존성 설치
        run: python -m pip install --quiet -r full_stack_lab/gateway/requirements.txt
      - name: 실제 정책 엔진·격리 공급자 준비
        run: |
          sudo ln -s "$PWD/full_stack_lab/opa" /policy
          docker run -d --name pg-suite-opa -p 127.0.0.1:8181:8181 -v /policy:/policy:ro \
            openpolicyagent/opa:1.20.2-static run --server --addr=0.0.0.0:8181 /policy
          for i in $(seq 1 60); do
            if curl -fsS "$GITEA_ADMIN_URL/api/healthz" >/dev/null && curl -fsS http://127.0.0.1:8181/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$GITEA_ADMIN_URL/api/healthz"
          curl -fsS http://127.0.0.1:8181/health
          docker exec "${{ job.services.gitea.id }}" gitea admin user create --admin --username "$GITEA_ADMIN_USER" \
            --password "$GITEA_ADMIN_PASSWORD" --email corpadmin@lab.test --must-change-password=false
          docker exec "${{ job.services.gitea.id }}" gitea admin user create --username mcp-bot \
            --random-password --email mcp-bot@lab.test --must-change-password=false
      - name: 파일별 전용 DB의 전체 PostgreSQL 회귀
        run: python full_stack_lab/tests/run_local_suite.py --pg --out pg-suite.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pg-suite
          path: pg-suite.json
          if-no-files-found: error
          retention-days: 14
      - name: 실패 로그
        if: failure()
        run: |
          docker logs pg-suite-opa
          docker logs "${{ job.services.postgres.id }}"
          docker logs "${{ job.services.gitea.id }}"
      - name: 정책 엔진 정리
        if: always()
        run: docker rm -f pg-suite-opa

  # 운영 배포 묶음(deploy/)을 빈 서버로 본 새 실행기에 README 절차 그대로 설치한다. 실습 스택과 같은 실행기를 쓰지 않는다.
  deploy:
    name: 운영 배포 설치 검증
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.code != 'false'
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        id: buildx
      - uses: ./.github/actions/compose-cache
        with:
          stack: deploy
          builder: ${{ steps.buildx.outputs.name }}

      - name: ./install.sh --bind <실행기 IPv4>
        run: |
          bind="$(ip -4 route get 1.1.1.1 | awk '{for (i = 1; i < NF; i++) if ($i == "src") print $(i + 1)}')"
          echo "MINT_BIND=$bind" >> "$GITHUB_ENV"
          ./install.sh --bind "$bind"

      - name: 기동·인증서·게시 범위·첫 관리자
        run: |
          base="https://$MINT_BIND"
          ca=ca/root.crt
          test -s "$ca" && test "$(stat -c %a .env)" = 600 && test "$(stat -c %a initial-admin-password)" = 600
          curl -fsS --cacert "$ca" "$base/api/health" | tee /tmp/health.json
          python3 -c 'import json; d = json.load(open("/tmp/health.json")); v = open("../VERSION").read().strip(); assert d["status"] == "ok" and d["build"]["revision"].startswith(v + "+g") and d["components"]["jaeger"] is None, d'
          ./mint.sh status
          # 게시 포트는 MINT_BIND의 443·3128뿐이다.
          ports="$(docker ps --format '{{.Ports}}' | tr ',' '\n' | grep -- '->' | sed 's/^ *//' | sort -u)"
          echo "$ports"
          test "$(echo "$ports" | grep -vcE "^$MINT_BIND:(443|3128)->")" = 0
          if curl -s --max-time 5 -o /dev/null "http://$MINT_BIND:8000/"; then echo "콘솔 HTTP가 열려 있음"; exit 1; fi
          login() { python3 -c 'import json,sys; print(json.dumps({"email": sys.argv[1], "password": sys.stdin.read().strip()}))' "$1"             | curl -s --cacert "$ca" -o /dev/null -w '%{http_code}' -X POST "$base/auth/mock-login" -H 'content-type: application/json' --data-binary @-; }
          test "$(login root < initial-admin-password)" = 200
          test "$(echo root | login root)" != 200
          test "$(echo user | login user)" != 200

      - name: 재기동·백업·복구가 관리자 비밀번호와 폐기 목록을 지킨다
        run: |
          base="https://$MINT_BIND"
          cp initial-admin-password /tmp/admin-pw
          ./mint.sh up
          cmp initial-admin-password /tmp/admin-pw
          ./mint.sh backup /tmp/mint-backup
          ls -l /tmp/mint-backup
          ./mint.sh restore /tmp/mint-backup
          curl -fsS --cacert ca/root.crt "$base/api/health" | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ok"'
          python3 -c 'import json,sys; print(json.dumps({"email": "root", "password": open("/tmp/admin-pw").read().strip()}))'             | curl -fsS --cacert ca/root.crt -o /dev/null -X POST "$base/auth/mock-login" -H 'content-type: application/json' --data-binary @-

      - name: 실패 시 컨테이너 로그
        if: failure()
        run: ./mint.sh logs

      - name: 정리
        if: always()
        run: ./mint.sh compose --profile siem down -v --remove-orphans || true

  # LiteLLM 애드온(D-191·D-208·D-249): 새 실행기에 deploy/ 묶음과 실제 LiteLLM 1.105를 올리고 공급자 운영 MCP(Microsoft Learn)로
  # A 경유·B 직접의 정상 호출, 직원별 원장 귀속, 외부 변경 재조회, 매핑 오류 격리, 관리 키 회전, 철회·복구를 확인한다. 대역 없음.
  litellm:
    name: LiteLLM 애드온 통합 검수
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.code != 'false'
    defaults:
      run:
        working-directory: deploy
    env:
      LITELLM_IMAGE: ghcr.io/berriai/litellm-database:v1.105.0@sha256:f99e4cc55ce8a1c6888504ac6eff147868979d37363a7246cf804bbabdc27e88
      LITELLM_DB_IMAGE: postgres:18.6-alpine3.24@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
      E2E: ../full_stack_lab/tests/litellm_addon_e2e.py
      MINT_ROOT_PASSWORD_FILE: ${{ github.workspace }}/deploy/initial-admin-password
      E2E_STATE: /tmp/litellm-e2e.json
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        id: buildx
      - uses: ./.github/actions/compose-cache
        with:
          stack: deploy
          builder: ${{ steps.buildx.outputs.name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: MINT 설치(deploy/)·AI 게이트웨이 직원 3명
        run: |
          python -m pip install --quiet mcp==2.2.0 httpx==0.28.1
          bind="$(ip -4 route get 1.1.1.1 | awk '{for (i = 1; i < NF; i++) if ($i == "src") print $(i + 1)}')"
          echo "MINT_BIND=$bind" >> "$GITHUB_ENV"
          echo "MINT_CA=$PWD/ca/root.crt" >> "$GITHUB_ENV"
          ./install.sh --bind "$bind"
          # 외부 변경 탐지를 CI 시간 안에 보려고 재조회 간격만 줄인다(기본 300초).
          sed -i 's/^MINT_LITELLM_SYNC_RECHECK_SECONDS=.*/MINT_LITELLM_SYNC_RECHECK_SECONDS=30/' .env
          pw="$(openssl rand -hex 16)"; echo "::add-mask::$pw"; echo "EMP_PASSWORD=$pw" >> "$GITHUB_ENV"
          for who in emp1 emp2 emp3; do printf '%s\n' "$pw" | ./mint.sh add-account "$who" --role 직원 --ai-gateway; done

      - name: LiteLLM 1.105 기동(A 경유 설정)
        run: |
          master="sk-$(openssl rand -hex 24)"; salt="sk-$(openssl rand -hex 24)"; dbpw="$(openssl rand -hex 24)"
          echo "::add-mask::$master"; echo "::add-mask::$salt"; echo "::add-mask::$dbpw"
          echo "LITELLM_MASTER_KEY=$master" >> "$GITHUB_ENV"
          # LiteLLM이 MINT(사설 CA)와 공급자(공인 CA)를 모두 검증하도록 묶음을 만든다.
          cat /etc/ssl/certs/ca-certificates.crt ca/root.crt > /tmp/litellm-ca.pem
          docker run -d --name litellm-db --network mint_edge -e POSTGRES_DB=litellm -e POSTGRES_USER=litellm \
            -e POSTGRES_PASSWORD="$dbpw" "$LITELLM_DB_IMAGE"
          cat > /tmp/start-litellm.sh <<EOF
          set -e
          docker rm -f litellm >/dev/null 2>&1 || true
          docker run -d --name litellm --network mint_edge --network-alias litellm -p 127.0.0.1:4000:4000 \
            -e DATABASE_URL=postgresql://litellm:$dbpw@litellm-db:5432/litellm -e LITELLM_MASTER_KEY=$master \
            -e LITELLM_SALT_KEY=$salt -e STORE_MODEL_IN_DB=True -e LITELLM_TELEMETRY=False -e DISABLE_ADMIN_UI=True \
            -e LITELLM_LOCAL_MODEL_COST_MAP=True -e SSL_CERT_FILE=/ca/bundle.pem -e REQUESTS_CA_BUNDLE=/ca/bundle.pem \
            -e MINT_GATEWAY_URL=https://$MINT_BIND -e MINT_CA_FILE=/ca/mint.pem \
            -v /tmp/litellm-ca.pem:/ca/bundle.pem:ro -v $PWD/ca/root.crt:/ca/mint.pem:ro \
            -v $GITHUB_WORKSPACE/addons/litellm/config/\$1:/lab/litellm.yaml:ro             -v $GITHUB_WORKSPACE/addons/litellm/mint_guardrail.py:/lab/mint_guardrail.py:ro             "$LITELLM_IMAGE" --config /lab/litellm.yaml --port 4000
          for i in \$(seq 1 90); do curl -fsS http://127.0.0.1:4000/health/liveliness >/dev/null 2>&1 && exit 0; sleep 3; done
          docker logs --tail 100 litellm; exit 1
          EOF
          until docker exec litellm-db pg_isready -U litellm >/dev/null 2>&1; do sleep 1; done
          bash /tmp/start-litellm.sh litellm-mint.yaml

      - name: ① 동기화 켜기 — 매핑·관리 키 연결, 기동 전 점검
        run: |
          python3 "$E2E" prepare
          ./mint.sh litellm enable --url http://litellm:4000 --bindings /tmp/bindings.json --route mint < /tmp/admin1.key
          ./mint.sh litellm status

      - name: ②③ 도입 승인 → LiteLLM 반영 → 직원 2명 A 경유 호출·원장 귀속
        run: |
          python3 "$E2E" register
          python3 "$E2E" call-a

      - name: ⑤ LiteLLM에서 바꾼 권한을 재조회로 찾아 되돌림
        run: python3 "$E2E" drift

      - name: ⑥ 매핑 하나가 틀려도 다른 직원은 계속 호출
        run: |
          python3 "$E2E" isolation-start
          ./mint.sh litellm enable --url http://litellm:4000 --bindings /tmp/bindings.json --route mint < /tmp/admin1.key
          python3 "$E2E" isolation-check
          ./mint.sh litellm enable --url http://litellm:4000 --bindings /tmp/bindings.json --route mint < /tmp/admin1.key

      - name: ① 관리 키 회전(재기동 없음)
        run: |
          ./mint.sh litellm rotate-key < /tmp/admin2.key
          python3 "$E2E" rotate-check
          ./mint.sh litellm check

      - name: ④ 철회 → 거절·관계없는 서버 유지 → 재승인 복구
        run: |
          python3 "$E2E" revoke
          python3 "$E2E" recover

      - name: ① 재기동 뒤에도 유지
        run: |
          ./mint.sh up
          python3 "$E2E" restart-check

      - name: ② B 직접 경로 — 가드레일 판정·제한 인자·사후 기록
        run: |
          ./mint.sh litellm enable --url http://litellm:4000 --bindings /tmp/bindings.json --route direct < /tmp/admin2.key
          bash /tmp/start-litellm.sh litellm-plugin.yaml
          python3 "$E2E" call-b

      - name: 실패 시 로그
        if: failure()
        run: |
          ./mint.sh litellm status || true
          ./mint.sh logs gateway agent-service | tail -200 || true
          docker logs --tail 300 litellm || true

      - name: 정리
        if: always()
        run: |
          docker rm -f litellm litellm-db || true
          ./mint.sh compose --profile siem down -v --remove-orphans || true

  verify:
    name: 완료 조건 전체 검증
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.code != 'false'
    defaults:
      run:
        working-directory: full_stack_lab
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        id: buildx
      - uses: ./.github/actions/compose-cache
        with:
          stack: full_stack_lab
          builder: ${{ steps.buildx.outputs.name }}

      - name: ./console.sh up --no-llm
        run: |
          ./console.sh init-disposal
          # The cache preparation already logs dependency resolution in plain mode.
          ./console.sh prepare-acceptance-tls
          export COMPOSE_FILE=compose.yaml:compose.acceptance.yaml
          export ACCEPTANCE_TLS_UID="$(id -u)" ACCEPTANCE_TLS_GID="$(id -g)"
          echo "COMPOSE_FILE=$COMPOSE_FILE" >> "$GITHUB_ENV"
          echo "ACCEPTANCE_TLS_UID=$ACCEPTANCE_TLS_UID" >> "$GITHUB_ENV"
          echo "ACCEPTANCE_TLS_GID=$ACCEPTANCE_TLS_GID" >> "$GITHUB_ENV"
          ./console.sh up --no-llm

      # Rego, classification self-check, gateway acceptance, the scripted workday of
      # four workstations, the termination judgment, security regression, E1-E3.
      - name: ./console.sh test
        run: TERMINATION_DISPOSABLE_LAB=1 ./console.sh test

      # The image's native engines (gitleaks C-ABI library, PCRE2 text rules) must decide
      # exactly like the gitleaks binary and Python's re they replaced.
      - name: 네이티브 검사 엔진 동등성
        run: |
          docker compose exec -T gateway python - < tests/secret_engine_parity_check.py
          docker compose exec -T gateway python - < tests/textscan_parity_check.py
          docker compose exec -T gateway python - < tests/output_credential_span_check.py

      # 실기기 배치(README "실제 기기로 배치하기"): 같은 스택에 Caddy를 얹고, 러너를 직원 PC로 삼는다 —
      # loopback HTTP → 키트 setup(합성 계정 로그인) → 실제 Claude Code·Codex CLI가 헬퍼로 서버 10개에 붙는지.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: 실기기 오버레이 — ./console.sh field up
        run: |
          echo "APPLIANCE_BIND=127.0.0.1" >> .env
          # Caddy now also publishes the browser-console port (D-129) on APPLIANCE_BIND; on the runner that is the same
          # loopback address as the base stack's Console port. Move the base one (an appliance binds a Tailscale IP, so no clash there).
          echo "CONSOLE_PORT=18000" >> .env
          # A.I.G 로컬 모델(D-47)은 실기기에서 받는다. CI는 검사 품질을 볼 수 없으므로 내려받지 않는다.
          echo "AIG_LOCAL_MODEL=none" >> .env
          APPLIANCE_BIND=127.0.0.1 ./console.sh field init-disposal --with-lab-mcp
          APPLIANCE_BIND=127.0.0.1 ./console.sh field up --with-lab-mcp
          APPLIANCE_BIND=127.0.0.1 ./console.sh field status
          APPLIANCE_BIND=127.0.0.1 ./console.sh field ca
          echo "FIELD_CA=$PWD/field/ca/root.crt" >> "$GITHUB_ENV"
          echo "FIELD_CA_SHA256=$(cat field/ca/root.sha256)" >> "$GITHUB_ENV"

      - name: 실기기 — 직원 PC 키트와 실제 하네스
        run: |
          npm install -g --no-fund --no-audit @anthropic-ai/claude-code@2.1.282 @openai/codex@0.157.0
          # README ②: 사내망에 열기 전에 계정마다 비밀번호를 바꾼다 — 바꾼 값으로 로그인되는지까지 본다.
          printf 'ci-field-password-01\n' | APPLIANCE_BIND=127.0.0.1 ./console.sh field set-password ysg@bob.local
          servers="$(python3 -c 'import tomllib; print(",".join(sorted(tomllib.load(open("registry/catalog.toml", "rb"))["servers"])))')"
          echo "ci-field-password-01" | python3 field/pc/mcpgw_pc.py setup --url https://127.0.0.1 \
            --ca "$FIELD_CA" --ca-sha256 "$FIELD_CA_SHA256" \
            --servers "$servers" --workstation ci-runner --email ysg@bob.local --password-stdin
          python3 ~/.mcpgw/mcpgw_pc.py doctor
          # D-51: 키트가 실제 하네스의 기본 커넥터·기능을 읽어 Gateway에 보고하는지(Codex 웹 검색은 기본으로 켜져 있다).
          export NODE_EXTRA_CA_CERTS="$FIELD_CA" CODEX_CA_CERTIFICATE="$FIELD_CA"
          python3 ~/.mcpgw/mcpgw_pc.py report | tee reports/field-report.txt
          grep -q "건 보고" reports/field-report.txt
          claude mcp list | tee reports/field-claude.txt
          test "$(grep -c '(HTTP) - ✔ Connected' reports/field-claude.txt)" -eq 10
          codex mcp get filesystem | tee reports/field-codex.txt
          grep -F "url: https://127.0.0.1/mcp/filesystem/" reports/field-codex.txt
          python3 ~/.mcpgw/mcpgw_pc.py uninstall
          if claude mcp get filesystem; then exit 1; fi

      # D-48: 내부 Gitea는 솔루션 로그인으로만 열린다. 브라우저는 로그인 화면으로, git은 같은 ID/PW로.
      # 클라이언트가 직접 실은 신원 헤더는 Caddy가 지우므로 아무 효력이 없다.
      - name: 실기기 — 내부 Git 로그인 연동
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          base=https://127.0.0.1
          code() { curl --cacert "$FIELD_CA" -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(code -H 'Accept: text/html' $base/git/)" = 302
          test "$(code -H 'X-WEBAUTH-USER: corpadmin' $base/git/api/v1/user)" = 401
          curl --cacert "$FIELD_CA" -fsS -c /tmp/jar -o /dev/null -X POST $base/auth/mock-login -H 'content-type: application/json' \
            -d '{"email":"ysg@bob.local","password":"ci-field-password-01"}'
          test "$(curl --cacert "$FIELD_CA" -s -b /tmp/jar -o /tmp/git.html -w '%{http_code}' $base/git/)" = 200
          grep -q '"/git/ysg"' /tmp/git.html
          # 인가: 관리자 역할은 Gitea 관리자라 랩의 비공개 저장소를 읽고, 직원은 같은 저장소를 읽지 못한다.
          git -c http.sslCAInfo="$FIELD_CA" ls-remote "https://kkg%40bob.local:test-password@127.0.0.1/git/bob/handbook.git" | grep -q HEAD
          if git -c http.sslCAInfo="$FIELD_CA" ls-remote "https://ysg%40bob.local:ci-field-password-01@127.0.0.1/git/bob/handbook.git"; then exit 1; fi
          if git -c http.sslCAInfo="$FIELD_CA" ls-remote "https://kkg%40bob.local:wrong-password@127.0.0.1/git/bob/handbook.git"; then exit 1; fi

      - name: 실패 시 컨테이너 로그
        if: failure()
        run: docker compose logs --tail=300 --no-color

      - name: 증적 업로드
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: full_stack_lab/reports/
          if-no-files-found: warn
          retention-days: 14

      - name: 정리
        if: always()
        run: APPLIANCE_BIND=127.0.0.1 FIELD_TLS_ADDRESSES='https://127.0.0.1:8080' docker compose -f compose.yaml -f compose.acceptance.yaml -f compose.field.yaml --profile llm down -v --remove-orphans
