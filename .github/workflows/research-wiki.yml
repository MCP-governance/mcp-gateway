name: Research Markdown and collaboration console
on:
  push:
    # 작업 브랜치는 PR 실행이 검사한다. 코드 전용 PR은 위키 생성물을 병합 뒤 한 번에 재생성한다.
    branches: [main]
    paths: ['research/llm-wiki/**', 'research/collaboration-console/**', 'docs/ai/**', 'full_stack_lab/opa/**', '.github/workflows/research-wiki.yml']
  pull_request:
    paths: ['research/llm-wiki/**', 'research/collaboration-console/**', 'docs/ai/**', 'full_stack_lab/opa/**', '.github/workflows/research-wiki.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/llm-wiki/tools/check_wiki.py --ci-ignored-local-sources
      - run: python research/llm-wiki/tools/check_trace.py --self-test
        if: ${{ !cancelled() }}
      - run: python research/llm-wiki/tools/check_trace.py
        if: ${{ !cancelled() }}
      - run: python research/llm-wiki/tools/check_enterprise_analysis.py
      - run: python research/llm-wiki/tools/test_enterprise_code_refresh.py
      - run: python research/collaboration-console/test_console.py
