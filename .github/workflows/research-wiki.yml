name: Research wiki
on:
  push:
    paths: ['research/llm-wiki/**', '.github/workflows/research-wiki.yml']
  pull_request:
    paths: ['research/llm-wiki/**', '.github/workflows/research-wiki.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/llm-wiki/requirements.txt
      - run: python research/llm-wiki/tools/check_wiki.py
