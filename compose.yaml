services:
  proxy:
    build:
      context: .
      target: proxy
    ports:
      - "127.0.0.1:${MCP_PROXY_PORT:-8080}:8080"
    volumes:
      - "${MCP_PROXY_CONFIG_FILE:-./proxy.docker.toml}:/app/proxy.toml:ro"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
    init: true

  demo:
    build:
      context: .
      target: demo
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
    init: true
