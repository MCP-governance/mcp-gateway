services:
  postgres:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: interop
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    command: [postgres, -c, max_connections=40, -c, shared_buffers=64MB, -c, work_mem=4MB]
    volumes: [postgres_data:/var/lib/postgresql]
    networks: [data]
    mem_limit: 256m
    cpus: 0.5
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U interop -d litellm]
      interval: 5s
      timeout: 3s
      retries: 30

  ollama:
    image: ollama/ollama:0.40.3@sha256:adca95a12c2b386a8f9a995e7fa0600e187e3323b5e5522f5a6c3b1ec73eff99
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: '2048'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_MAX_QUEUE: '2'
      OLLAMA_KEEP_ALIVE: 2m
      OLLAMA_NO_CLOUD: '1'
    volumes: [ollama_models:/root/.ollama]
    networks: [model]
    mem_limit: 2g
    cpus: 2
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 5s
      timeout: 3s
      retries: 30

  litellm:
    image: ghcr.io/berriai/litellm-database:v1.105.0@sha256:f99e4cc55ce8a1c6888504ac6eff147868979d37363a7246cf804bbabdc27e88
    restart: unless-stopped
    entrypoint: [/bin/sh, /lab/litellm-entrypoint.sh]
    environment:
      LITELLM_TELEMETRY: 'False'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      DISABLE_ADMIN_UI: 'True'
      STORE_MODEL_IN_DB: 'False'
      PROXY_BASE_URL: https://${INTEROP_BIND:?set the solution appliance Tailscale IPv4}:8448
    secrets: [postgres_password, litellm_master_key, litellm_salt_key]
    volumes:
      - ./litellm.yaml:/lab/litellm.yaml:ro
      - ./litellm-entrypoint.sh:/lab/litellm-entrypoint.sh:ro
    networks: [model, data, llm_edge, mcp_egress]
    depends_on:
      postgres: {condition: service_healthy}
      ollama: {condition: service_healthy}
    mem_limit: 1536m
    cpus: 2
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 60

  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    environment:
      INTEROP_BIND: ${INTEROP_BIND:?set the solution appliance Tailscale IPv4}
    ports:
      - '${INTEROP_BIND:?set the solution appliance Tailscale IPv4}:8448:8448'
      - '${INTEROP_BIND:?set the solution appliance Tailscale IPv4}:8449:8449'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [llm_edge, secret_edge]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    cpus: 0.25
    security_opt: [no-new-privileges:true]
    depends_on: [litellm]

secrets:
  postgres_password:
    file: ${INTEROP_SECRET_DIR:?set a protected directory outside Git}/postgres_password
  litellm_master_key:
    file: ${INTEROP_SECRET_DIR:?set a protected directory outside Git}/litellm_master_key
  litellm_salt_key:
    file: ${INTEROP_SECRET_DIR:?set a protected directory outside Git}/litellm_salt_key

networks:
  model: {internal: true}
  data: {internal: true}
  llm_edge: {internal: true}
  secret_edge: {internal: true}
  mcp_egress: {}

volumes:
  postgres_data: {}
  ollama_models: {}
  caddy_data: {}
  caddy_config: {}
