# ── usage relationships (paper: organisation · purpose · provider · resources) ──
# Termination cases are opened per relationship, not per server.
[[usage_relationships]]
id = "UR-GITEA-DEV"
server = "gitea"
purpose = "사내 코드 저장소 조회·이슈 관리 (플랫폼개발팀)"
provider = "DevHub"
owner_department = "플랫폼개발팀"
