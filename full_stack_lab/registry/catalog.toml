[servers.email]
display_name = "Email · 사내 메일"
package = "mcp-email-server"
version = "1.9.1"
source_url = "https://github.com/Wh1isper/mcp-email-server"
supplier = "MailOps (위탁 운영)"
license = "MIT"
endpoint = "http://mcp-email:8000/mcp"
# Operated by an outside provider on the organisation's behalf. It holds the
# ai-assistant mailbox password; the contract did NOT require disclosure of that
# server-held credential, so the population of revocation targets cannot be
# enumerated at termination (paper 5.1 -> best achievable grade T3).
deployment = "provider"
downstream = "corp-mail (ai-assistant 메일함 비밀번호를 서버가 보유)"
[servers.email.exit_terms]
provider_credential_disclosure = false
revocation_evidence = false
audit_access_retained = false
[servers.email.tools]
list_available_accounts = "r"
list_email_tags = "r"
list_emails_metadata = "r"
get_emails_content = "r"
list_mailboxes = "r"
list_allowed_recipients = "r"
list_allowed_senders = "r"
get_attachment_content = "r"
# send/forward: w for internal recipients, x when any recipient is external.
send_email = "w"
forward_email = "w"
save_to_mailbox = "w"
mark_emails_as_read = "w"
set_email_flags = "w"
set_email_tags = "w"
move_emails = "w"
archive_emails = "w"
delete_emails = "w"

[servers.gitea]
display_name = "Gitea · 사내 코드 저장소"
package = "gitea-mcp-server"
version = "1.7.0"
source_url = "https://gitea.com/gitea/gitea-mcp"
supplier = "DevHub (위탁 운영)"
license = "MIT"
endpoint = "http://mcp-gitea:8000/mcp"
# Provider-operated, holds its own Gitea access token (server-held credential,
# paper 3.2 / E3). The contract requires disclosure and revocation records, and the
# organisation is the Gitea admin, so the token can be verified independently.
deployment = "provider"
downstream = "corp-git (mcp-bot 계정의 액세스 토큰을 서버가 보유)"
[servers.gitea.exit_terms]
provider_credential_disclosure = true
revocation_evidence = true
audit_access_retained = true
[[servers.gitea.server_held_credentials]]
id = "gitea-mcp-bot-token"
label = "mcp-bot 계정의 Gitea 액세스 토큰 'gitea-mcp-server'"
system = "corp-git"
verify = "gitea-token"
account = "mcp-bot"
token_name = "gitea-mcp-server"
