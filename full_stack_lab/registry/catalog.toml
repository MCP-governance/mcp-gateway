# MCP Registry — the one place that says which servers and tools the organisation
# approved, what each tool does (r/w/x), how its arguments map to company data, and
# which usage relationships (paper: organisation · purpose · provider · resources)
# exist. The Gateway loads this at start and syncs it into mcp_servers / mcp_tools /
# usage_relationships. Approved description/schema hashes live next to it in
# contracts.lock.json, generated by `./console.sh contracts --update`.
#
# A tool that is not listed under [servers.<id>.tools] is not approved: it is hidden
# from tools/list and a call to it is blocked as MCP-REGISTRY-001.

[organization]
name = "BoB Corp"
internal_email_domains = ["bob.local"]
# Web hosts employees may reach through fetch/playwright. Anything else that
# resolves inside the lab is infrastructure (SSRF target) and is never allowed.
intranet_hosts = ["intranet.bob.local"]
infrastructure_hosts = [
  "gateway", "gateway-sse", "agent-service", "db", "opa", "otel-collector", "ollama", "llm-gateway",
  "corp-db", "corp-redis", "corp-mail", "corp-git", "localhost", "127.0.0.1", "0.0.0.0",
  "169.254.169.254", "metadata.google.internal", "host.docker.internal",
]
infrastructure_prefixes = ["mcp-", "10.", "172.", "192.168.", "127."]
journal_address = "compliance@bob.local"

# ── data classification (longest prefix wins; unmatched data is important) ─────
[classification.paths]
"/shared/public" = "public"
"/shared/partners" = "public"
"/shared/team" = "nonimportant"
"/shared/confidential" = "important"
"/workspace" = "nonimportant"
"/repos/handbook" = "public"
"/repos/payment-service" = "nonimportant"
"/repos/infra-secrets" = "important"

[classification.owners]
"/shared/team/platform" = "플랫폼개발팀"
"/shared/team/data" = "데이터분석팀"
"/shared/team/security" = "보안기술팀"
"/shared/confidential/hr" = "경영지원팀"
"/shared/confidential/finance" = "경영지원팀"
"/shared/confidential/customers" = "데이터분석팀"

[classification.repos]
"bob/handbook" = "public"
"bob/payment-service" = "nonimportant"
"bob/infra-secrets" = "important"

[classification.tables]
"public.products" = "public"
"sales.orders" = "nonimportant"
"sales.customers" = "important"
"hr.employees" = "nonimportant"
"hr.salaries" = "important"
# catalog views are metadata, not company data
"information_schema" = "public"
"pg_catalog" = "public"

[classification.redis]
"cache:" = "public"
"feature:" = "nonimportant"
"session:" = "important"

[classification.web]
"intranet.bob.local" = "nonimportant"

