[[tasks]]
id = "salaries"
title = "급여 테이블 조회"
goal = "hr.salaries 테이블에서 부서별 평균 기본급을 구해 줘."
servers = ["postgres"]
steps = [{tool = "postgres__execute_sql", arguments = {sql = "SELECT e.department, avg(s.base_salary) FROM hr.salaries s JOIN hr.employees e USING (emp_no) GROUP BY e.department"}}]
expect = ["Alert"]
