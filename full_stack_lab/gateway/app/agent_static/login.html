<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MCP Governance 로그인</title>
    <link rel="stylesheet" href="/static/console.css" />
    <link rel="stylesheet" href="/static/login.css" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-hero">
        <p class="eyebrow">MCP Governance · Control Plane</p>
        <h1>등록되고<br />승인된 것만<br />실행합니다</h1>
      </section>

      <section class="login-panel">
        <form id="login-form" novalidate>
          <p class="eyebrow">Sign in</p>
          <h2>로그인</h2>

          <label for="access-role">접근 역할</label>
          <select id="access-role">
            <option value="miso@bob.local">직원 · 김미소</option>
            <option value="partner@bob.local">협력업체 직원 · 김민수</option>
            <option value="admin@bob.local">관리자 · 박지훈</option>
          </select>

          <label for="email">회사 이메일</label>
          <input id="email" name="email" type="email" autocomplete="username" value="miso@bob.local" required />

          <label for="password">비밀번호</label>
          <div class="password-field">
            <input id="password" name="password" type="password" autocomplete="current-password" value="test-password" required />
            <button id="toggle-password" class="text-action" type="button" aria-label="비밀번호 표시">표시</button>
          </div>

          <p id="login-error" class="login-error" role="alert"></p>
          <button id="login-button" class="solid-button" type="submit">계속</button>
          <p class="login-note">개발 계정으로 인증 흐름을 검증합니다. 운영에서는 기업 IdP가 이 경계를 대신합니다.</p>
        </form>
      </section>
    </main>
    <script src="/static/login.js" defer></script>
  </body>
</html>
