<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>로그인 · MCP Governance</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/console.css" />
  <link rel="stylesheet" href="/static/login.css" />
</head>
<body class="gate">
  <div class="gate-layout">
  <section class="gate-intro" aria-label="MCP Governance"><span class="gate-kicker">MCP GOVERNANCE</span><h1>도구 연결부터<br />실행과 회수까지</h1><p>조직의 MCP 연결, 사용자와 단말, 승인과 감사 기록을 한 곳에서 관리합니다.</p><div class="gate-points"><span>연결·접근 관리</span><span>정책·실행 추적</span><span>종료·회수 증거</span></div></section>
  <main class="panel gate-card">
    <header class="brand">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg></span>
      <div><b>MCP Governance Console</b><span>내부망 운영 콘솔</span></div>
    </header>

    <div class="gate-heading"><h2>조직 워크스페이스 로그인</h2><p>계정으로 로그인해 MCP 연결과 조직 정책을 확인하세요.</p></div>
    <form id="gate-form" class="form stack">
      <label>아이디
        <input id="email" name="email" type="text" autocomplete="username" required />
      </label>
      <label>비밀번호
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </label>
      <p class="err" id="gate-error" role="alert" tabindex="-1"></p>
      <button class="btn primary" id="gate-go" type="submit">로그인</button>
      <a href="/signup">회원가입 신청</a>
    </form>
  </main>
  </div>
  <script src="/static/login.js"></script>
</body>
</html>
