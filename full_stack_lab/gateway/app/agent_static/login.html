<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>로그인 · MCP Governance</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/console.css" />
  <link rel="stylesheet" href="/static/login.css" />
</head>
<body class="gate">
  <main class="panel gate-card">
    <header class="gate-brand">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg></span>
      <b>MCP Governance</b>
    </header>
    <h1>로그인</h1>
    <div id="sso-login" class="stack" hidden><a class="btn primary" href="/auth/oidc/login" id="sso-button">SSO로 로그인</a><p id="sso-error" class="err" role="alert"></p></div>
    <form id="gate-form" class="form stack" hidden>
      <label>아이디
        <input id="email" name="email" type="text" autocomplete="username" required />
      </label>
      <label>비밀번호
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </label>
      <p class="err" id="gate-error" role="alert" tabindex="-1"></p>
      <button class="btn primary" id="gate-go" type="submit">로그인</button>
      <a href="/signup">가입 요청</a>
    </form>
  </main>
  <script src="/static/login.js"></script>
</body>
</html>
