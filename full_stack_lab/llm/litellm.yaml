# LiteLLM proxy for the office network. Employees never see the Ollama endpoint;
# they see one model alias and hold a virtual key that LiteLLM ties to their email.
model_list:
  - model_name: bob-assistant
    litellm_params:
      model: os.environ/LOCAL_LLM_MODEL_ROUTE
      api_base: http://ollama:11434
      # Small CPU models are slow on the first prompt that carries tool schemas.
      timeout: 180

litellm_settings:
  drop_params: true
  telemetry: false
  request_timeout: 180

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Keys are created only by llm-provision with the master key; nobody on the
  # office network can mint their own.
  allow_user_auth: false
