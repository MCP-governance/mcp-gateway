# LiteLLM proxy: the company LLM gateway on the office network. Employees never see
# the Ollama endpoint; every harness is configured for one model name and holds a
# virtual key that LiteLLM ties to their email. LiteLLM also translates the wire
# format each harness speaks (D-31):
#   Claude Code  -> /v1/messages (Anthropic)       Codex CLI -> /v1/responses (OpenAI)
#   Gemini CLI   -> /v1beta/models/*:generateContent   OpenCode -> /v1/chat/completions
#
# Route through Ollama's OpenAI-compatible endpoint: with the `ollama_chat/` provider
# this LiteLLM version dropped the model's tool_calls (content "" and no calls),
# while /v1 passes them through unchanged.
model_list:
  - model_name: bob-assistant
    litellm_params:
      model: openai/bob-assistant
      api_base: http://ollama:11434/v1
      api_key: ollama-local-no-auth
      # qwen3.5 thinks by default; on a CPU that is ~1 min of hidden tokens per turn.
      # Ollama's OpenAI endpoint honours reasoning_effort "none" (measured: 70 s -> 1.3 s).
      reasoning_effort: none
      # The first turn carries the harness prompt and tool schemas: minutes on a CPU.
      timeout: 900

litellm_settings:
  drop_params: true
  telemetry: false
  request_timeout: 900

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Keys are created only by llm-provision with the master key; nobody on the
  # office network can mint their own.
  allow_user_auth: false
