# 제품 스택과 따로 세우는 LiteLLM 프록시(LLM 게이트웨이 모드 + 게이트웨이 전용 MCP 집계). A 경유(MINT_LITELLM_ROUTE=mint) 전용 묶음이다:
# 출구가 MINT뿐이라 B 직접 경로(LiteLLM이 원래 MCP 서버로 나감)는 이 구성에서 동작하지 않는다(D-249).
# compose 프로젝트·망·볼륨을 공유하지 않는다.
#
# 망 구조(D-191): LiteLLM은 internal 망(model·data·inner)에만 붙어 밖으로 나가는 길이 없다.
#   직원 쪽 입구  edge-proxy:4000  -> litellm:4000       (loopback 게시, 하네스 컨테이너는 edge 망)
#   LiteLLM 출구  edge-proxy:8081  -> 제품 게이트웨이 /mcp/*  (TLS 검증, 그 밖의 경로·호스트는 403)
# 그래서 LiteLLM의 MCP 집계는 설정 실수나 관리자 API 등록이 있어도 제품 게이트웨이 말고는 닿을 곳이 없다.
name: mint-llm

services:
  postgres:
    image: postgres:18.6-alpine3.24@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [pg_data:/var/lib/postgresql]
    networks: [data]
    mem_limit: 256m
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 3s
      retries: 30

  ollama:
    image: ollama/ollama:0.40.3@sha256:adca95a12c2b386a8f9a995e7fa0600e187e3323b5e5522f5a6c3b1ec73eff99
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: "16384"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_NO_CLOUD: "1"
    volumes: [ollama_models:/root/.ollama]
    networks: [model]
    mem_limit: 3g
    cpus: 4
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  litellm:
    # 지원 판본 고정(1.105.0). 판본을 올리면 CI의 LiteLLM 애드온 통합 검수를 먼저 통과시킨다.
    image: ghcr.io/berriai/litellm-database:v1.105.0@sha256:f99e4cc55ce8a1c6888504ac6eff147868979d37363a7246cf804bbabdc27e88
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/lab/entrypoint.sh"]
    environment:
      LITELLM_TELEMETRY: "False"
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      DISABLE_ADMIN_UI: "True"
      STORE_MODEL_IN_DB: "False"
    secrets: [postgres_password, litellm_master_key, litellm_salt_key]
    volumes:
      - ./litellm.yaml:/lab/litellm.yaml:ro
      - ./entrypoint.sh:/lab/entrypoint.sh:ro
    networks: [model, data, inner]
    depends_on:
      postgres: {condition: service_healthy}
      ollama: {condition: service_healthy}
    mem_limit: 1536m
    cpus: 2
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 60

  edge-proxy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    environment:
      GATEWAY_ADDR: ${GATEWAY_ADDR:?MINT 게이트웨이 주소(<IP 또는 이름>:443)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./secrets/gateway-ca.pem:/etc/caddy/gateway-ca.pem:ro
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4010}:4000"
    networks: [inner, edge]
    depends_on:
      litellm: {condition: service_healthy}
    mem_limit: 128m
    read_only: true
    tmpfs: [/data, /config]
    # caddy 실행 파일에 파일 capability(net_bind_service)가 있어 경계 집합에서 빼면 exec가 거부된다. 쓰는 포트는 모두 1024 이상.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

secrets:
  postgres_password: {file: ./secrets/postgres_password}
  litellm_master_key: {file: ./secrets/litellm_master_key}
  litellm_salt_key: {file: ./secrets/litellm_salt_key}

networks:
  model: {internal: true}
  data: {internal: true}
  inner: {internal: true}
  edge: {}

volumes:
  pg_data: {}
  ollama_models: {}
