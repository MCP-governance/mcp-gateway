# LLM 전용 프로필: MCP 집계에 등록된 서버가 없다(litellm.yaml에서 mcp_servers만 뺀 것). 키는 allowed_routes=[llm_api_routes]로 발급한다.
# 제품 랩 litellm.yaml(llm/litellm.yaml)과 같은 모양: 직원은 모델 이름 하나(bob-assistant)와 자기 가상 키만 안다.
# 로컬 모델은 비용이 0이라 예산 정책이 안 걸리므로 시험용 단가를 model_info에 둔다(실제 과금 아님).
model_list:
  - model_name: bob-assistant
    litellm_params:
      model: openai/qwen3:0.6b
      api_base: http://ollama:11434/v1
      api_key: ollama-local-no-auth
      reasoning_effort: none
      timeout: 180
    model_info:
      input_cost_per_token: 0.00001
      output_cost_per_token: 0.00002
  - model_name: bob-reserved
    litellm_params:
      model: openai/qwen3:0.6b
      api_base: http://ollama:11434/v1
      api_key: ollama-local-no-auth
      reasoning_effort: none
      timeout: 180
    model_info:
      input_cost_per_token: 0.00001
      output_cost_per_token: 0.00002

# 입력 가드레일: 비밀값·주민등록번호 형태가 들어 있는 프롬프트는 모델에 보내기 전에 막는다.
# mcp_security: 요청의 tools에 이 프록시에 등록되지 않은 MCP 서버(제공자가 직접 실행하는 원격 MCP)가 있으면 막는다.
guardrails:
  - guardrail_name: mint-input-filter
    litellm_params:
      guardrail: litellm_content_filter
      mode: pre_call
      default_on: true
      patterns:
        - {pattern_type: prebuilt, pattern_name: aws_access_key, action: BLOCK}
        - {pattern_type: prebuilt, pattern_name: github_token, action: BLOCK}
        - {pattern_type: regex, pattern: '\b\d{6}-[1-4]\d{6}\b', name: kr_rrn, action: BLOCK}
  - guardrail_name: mint-mcp-registered-only
    litellm_params:
      guardrail: mcp_security
      mode: pre_call
      default_on: true
      on_violation: block

litellm_settings:
  drop_params: true
  telemetry: false
  request_timeout: 180

router_settings:
  num_retries: 0

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  allow_user_auth: false
  # 키가 MCP 서버 접근을 명시하지 않으면 어떤 MCP 서버도 쓸 수 없다(모델 전용 키의 기본값).
  require_key_mcp_access_defined: true
  # 프롬프트·응답 본문을 지출 로그에 남긴다(보존·접근 통제는 운영 정책, 보고서 한계 참조).
  store_prompts_in_spend_logs: true
