# 제품 랩 litellm.yaml(llm/litellm.yaml)과 같은 모양: 직원은 모델 이름 하나(bob-assistant)와 자기 가상 키만 안다.
# 로컬 모델은 비용이 0이라 예산 정책이 안 걸리므로 시험용 단가를 model_info에 둔다(실제 과금 아님).
model_list:
  - model_name: bob-assistant
    litellm_params:
      model: openai/qwen3:0.6b
      api_base: http://ollama:11434/v1
      api_key: ollama-local-no-auth
      reasoning_effort: none
      timeout: 180
    model_info:
      input_cost_per_token: 0.00001
      output_cost_per_token: 0.00002
  - model_name: bob-reserved
    litellm_params:
      model: openai/qwen3:0.6b
      api_base: http://ollama:11434/v1
      api_key: ollama-local-no-auth
      reasoning_effort: none
      timeout: 180
    model_info:
      input_cost_per_token: 0.00001
      output_cost_per_token: 0.00002

# MCP 집계 경로 점검 전용: 공개 Microsoft Learn MCP(인증 없음, 읽기 전용) 하나만 둔다. 제품 Gateway를 거치지 않는 경로이므로 제품 설정에는 넣지 않는다.
mcp_servers:
  microsoft_learn:
    url: https://learn.microsoft.com/api/mcp
    transport: http
    auth_type: none
    allowed_tools: [microsoft_docs_search, microsoft_docs_fetch, microsoft_code_sample_search]

litellm_settings:
  drop_params: true
  telemetry: false
  request_timeout: 180

router_settings:
  num_retries: 0

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  allow_user_auth: false
  require_key_mcp_access_defined: true
