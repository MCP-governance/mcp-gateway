# Local Keycloak integration. No accounts or bindings are auto-created.
services:
  agent-service:
    environment: &oidc-environment
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://127.0.0.1:18090/realms/mcpgw}
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/mcpgw/.well-known/openid-configuration
      OIDC_CLIENT_ID: mcp-console
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Generate OIDC_CLIENT_SECRET in .env}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://127.0.0.1:18000/auth/oidc/callback}
      OIDC_SESSION_SECRET: ${OIDC_SESSION_SECRET:?Generate OIDC_SESSION_SECRET in .env}
      OIDC_PROVIDER_LABEL: Keycloak
  gateway:
    environment: *oidc-environment
  gateway-sse:
    environment: *oidc-environment
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set a private bootstrap password in .env}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://127.0.0.1:18090}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://127.0.0.1:18000/auth/oidc/callback}
    ports: ["127.0.0.1:${KEYCLOAK_PORT:-18090}:8080"]
    networks: [edge, office]
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./identity/realm.json:/opt/keycloak/data/import/mcpgw-realm.json:ro
volumes:
  keycloak_data: {}
