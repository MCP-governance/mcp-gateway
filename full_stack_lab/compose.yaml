name: mcp-governance-full

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mcp_governance
      POSTGRES_USER: mcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo-only-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp -d mcp_governance"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - db_data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    networks: [data]

  opa:
    image: openpolicyagent/opa:1.20.2-static
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --set=decision_logs.console=true
      - --log-level=info
      - /policy
    healthcheck:
      test: ["CMD", "/opa", "eval", "1"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - ./opa:/policy:ro
    networks: [policy]

  mock-http-mcp:
    build: ./mock_server
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_PORT: "9000"
      MCP_CATALOG_MODE: ${MCP_CATALOG_MODE:-normal}
      EFFECT_LOG: /runtime/upstream-effects.jsonl
    volumes:
      - effects:/runtime
    networks: [tools]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  gateway:
    build: ./gateway
    environment: &gateway-env
      DATABASE_URL: postgresql://mcp:${POSTGRES_PASSWORD:-demo-only-change-me}@db:5432/mcp_governance
      OPA_URL: http://opa:8181/v1/data/mcp/authz/decision
      HTTP_MCP_URL: http://mock-http-mcp:9000/mcp/
      EFFECT_LOG: /runtime/upstream-effects.jsonl
      REPORT_DIR: /reports
      GITHUB_MCP_URL: https://api.githubcopilot.com/mcp/
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:-}
      GITHUB_ALLOWED_REPOS: ${GITHUB_ALLOWED_REPOS:-MCP-governance/mcp-gateway}
      # Verifiers get the public key only; they cannot mint a token.
      AGENT_JWT_PUBLIC_KEY: ${AGENT_JWT_PUBLIC_KEY:?Run ./demo.sh to initialize the local signing keys}
      OTEL_SERVICE_NAME: mcp-security-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    depends_on:
      db:
        condition: service_healthy
      opa:
        condition: service_healthy
      mock-http-mcp:
        condition: service_started
      jaeger:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - effects:/runtime:ro
      - ./reports:/reports:ro
      - ./opa:/policy:ro
    networks: [edge, policy, tools, data, telemetry]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  agent-service:
    build: ./gateway
    command: ["uvicorn", "app.agent_service:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql://mcp:${POSTGRES_PASSWORD:-demo-only-change-me}@db:5432/mcp_governance
      GATEWAY_URL: http://gateway:8080
      # The only service that holds the signing key, because it is the issuer.
      AGENT_JWT_PRIVATE_KEY: ${AGENT_JWT_PRIVATE_KEY:?Run ./demo.sh}
      AGENT_JWT_PUBLIC_KEY: ${AGENT_JWT_PUBLIC_KEY:?Run ./demo.sh}
      MOCK_SSO_PASSWORD: ${MOCK_SSO_PASSWORD:-test-password}
      MODEL_MODE: ${MODEL_MODE:-mock}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-20}
      OTEL_SERVICE_NAME: agent-service
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      gateway:
        condition: service_started
    networks: [edge, agent, data, telemetry]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  gateway-sse:
    build: ./gateway
    command: ["python", "-m", "app.sse_entry"]
    environment: *gateway-env
    depends_on:
      db:
        condition: service_healthy
      opa:
        condition: service_healthy
      mock-http-mcp:
        condition: service_started
    volumes:
      - effects:/runtime:ro
      - ./reports:/reports:ro
      - ./opa:/policy:ro
    networks: [policy, tools, data, telemetry]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # 제출된 저장소를 격리해서 복제·검사만 하는 워커. 저장소 코드는 실행하지 않고
  # Gateway와 파일시스템·네트워크를 공유하지 않는다. tools/policy 망에 붙이지
  # 않으므로 여기서 무엇이 실행돼도 MCP 실행 경로에는 닿지 않는다.
  intake-worker:
    build:
      context: ./supply_chain
      dockerfile: intake-worker.Dockerfile
    environment:
      DATABASE_URL: postgresql://mcp:${POSTGRES_PASSWORD:-demo-only-change-me}@db:5432/mcp_governance
      REPORT_DIR: /reports
      INTAKE_WORK_DIR: /work
      SEMGREP_RULES: /rules/semgrep-mcp.yml
      INTAKE_POLL_SECONDS: ${INTAKE_POLL_SECONDS:-5}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # 호스트 bind가 아니라 named volume을 쓴다. 워커는 비특권 uid로 돌고 호스트
      # reports/는 사용자 소유라 쓰기가 막히는데, 스캐너 출력이 조용히 사라지면
      # "증적 없는 검증 통과"가 만들어진다.
      - intake_reports:/reports
      - ./supply_chain/semgrep-mcp.yml:/rules/semgrep-mcp.yml:ro
      - intake_work:/work
      # 워크스페이스 스캔용 trivy_cache는 root 소유로 만들어져 있어 비특권 워커가
      # 쓸 수 없다. DB 캐시는 워커 전용 볼륨에 둔다.
      - intake_trivy_cache:/trivy-cache
    networks: [data, scanner]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    command:
      - --set=receivers.otlp.protocols.grpc.endpoint=0.0.0.0:4317
      - --set=receivers.otlp.protocols.http.endpoint=0.0.0.0:4318
      - --set=extensions.jaeger_query.http.endpoint=0.0.0.0:16686
    ports:
      - "127.0.0.1:16686:16686"
    networks: [telemetry]

  syft:
    image: anchore/syft:v1.51.1
    profiles: [supply-chain]
    environment:
      SYFT_CHECK_FOR_APP_UPDATE: "false"
    command:
      - dir:/workspace/full_stack_lab
      - --source-name
      - mcp-gateway
      - --source-version
      - local-workspace
      - -o
      - cyclonedx-json=/reports/sbom.cdx.json
    volumes:
      - ..:/workspace:ro
      - ./reports:/reports
    network_mode: none

  trivy:
    image: aquasec/trivy:0.74.0
    profiles: [supply-chain]
    command:
      - fs
      - --scanners
      - vuln,misconfig,secret,license
      - --format
      - json
      - --output
      - /reports/trivy.json
      - --skip-dirs
      - /workspace/.git
      - /workspace/full_stack_lab
    volumes:
      - ..:/workspace:ro
      - ./reports:/reports
      - trivy_cache:/root/.cache/trivy
    networks: [scanner]

  semgrep:
    image: semgrep/semgrep:1.172.0
    profiles: [supply-chain]
    environment:
      SEMGREP_SEND_METRICS: "off"
    command:
      - semgrep
      - scan
      - --config
      - /rules/semgrep-mcp.yml
      - --json
      - --output
      - /reports/semgrep.json
      - /workspace/full_stack_lab
    volumes:
      - ..:/workspace:ro
      - ./reports:/reports
      - ./supply_chain/semgrep-mcp.yml:/rules/semgrep-mcp.yml:ro
    network_mode: none


networks:
  edge: {}
  agent:
    internal: true
  policy:
    internal: true
  tools:
    internal: true
  data:
    internal: true
  telemetry:
    internal: true
  scanner: {}

volumes:
  db_data: {}
  effects: {}
  trivy_cache: {}
  intake_work: {}
  intake_reports: {}
  intake_trivy_cache: {}
