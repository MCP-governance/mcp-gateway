name: mcp-governance-full

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mcp_governance
      POSTGRES_USER: mcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo-only-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp -d mcp_governance"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - db_data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    networks: [data]

  opa:
    image: openpolicyagent/opa:1.20.2-static
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --set=decision_logs.console=true
      - --log-level=info
      - /policy
    healthcheck:
      test: ["CMD", "/opa", "eval", "1"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - ./opa:/policy:ro
    networks: [policy]

  mock-http-mcp:
    build: ./mock_server
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_PORT: "9000"
      MCP_CATALOG_MODE: ${MCP_CATALOG_MODE:-normal}
      EFFECT_LOG: /runtime/upstream-effects.jsonl
    volumes:
      - effects:/runtime
    networks: [tools]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  gateway:
    build: ./gateway
    environment: &gateway-env
      DATABASE_URL: postgresql://mcp:${POSTGRES_PASSWORD:-demo-only-change-me}@db:5432/mcp_governance
      OPA_URL: http://opa:8181/v1/data/mcp/authz/decision
      HTTP_MCP_URL: http://mock-http-mcp:9000/mcp/
      EFFECT_LOG: /runtime/upstream-effects.jsonl
      REPORT_DIR: /reports
      GITHUB_MCP_URL: https://api.githubcopilot.com/mcp/
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:-}
      GITHUB_ALLOWED_REPOS: ${GITHUB_ALLOWED_REPOS:-MCP-governance/mcp-gateway}
      # Verifiers get the public key only; they cannot mint a token.
      AGENT_JWT_PUBLIC_KEY: ${AGENT_JWT_PUBLIC_KEY:?Run ./console.sh to initialize the local signing keys}
      OTEL_SERVICE_NAME: mcp-security-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    depends_on:
      db:
        condition: service_healthy
      opa:
        condition: service_healthy
      mock-http-mcp:
        condition: service_started
      jaeger:
        condition: service_started
    ports:
      # 기본은 그대로 loopback이다. tailnet에서만 보이게 하려면 BIND_ADDR에 이
      # 호스트의 tailscale0 주소(100.x)를 넣는다. 0.0.0.0은 넣지 않는다 - 그
      # 순간 이 실습의 유일한 경로 통제가 사라진다. NETWORK.md 참고.
      - "${BIND_ADDR:-127.0.0.1}:8080:8080"
    volumes:
      - effects:/runtime:ro
      - ./reports:/reports:ro
      - ./opa:/policy:ro
    networks: [edge, policy, tools, data, telemetry]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  agent-service:
    build: ./gateway
    command: ["uvicorn", "app.agent_service:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql://mcp:${POSTGRES_PASSWORD:-demo-only-change-me}@db:5432/mcp_governance
      GATEWAY_URL: http://gateway:8080
      # The only service that holds the signing key, because it is the issuer.
      AGENT_JWT_PRIVATE_KEY: ${AGENT_JWT_PRIVATE_KEY:?Run ./console.sh}
      AGENT_JWT_PUBLIC_KEY: ${AGENT_JWT_PUBLIC_KEY:?Run ./console.sh}
      MOCK_SSO_PASSWORD: ${MOCK_SSO_PASSWORD:-test-password}
      MODEL_MODE: ${MODEL_MODE:-mock}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-20}
      # Console이 "AI 코드 감사를 지금 돌릴 수 있는가"를 답하려면 워커와 같은
      # 설정을 봐야 한다. 키는 연결 확인 요청에만 쓰고 화면으로 내보내지 않는다.
      MCP_SCAN_BASE_URL: ${MCP_SCAN_BASE_URL:-}
      MCP_SCAN_MODEL: ${MCP_SCAN_MODEL:-}
      MCP_SCAN_API_KEY: ${MCP_SCAN_API_KEY:-}
      # 워커가 lease를 갱신하는 주기보다 넉넉하게. 이 시간을 넘도록 소식이 없으면
      # Console이 "설정됨"이 아니라 "실행할 워커 없음"이라고 말해야 한다.
      INTAKE_WORKER_STALE_SECONDS: ${INTAKE_WORKER_STALE_SECONDS:-60}
      MCP_SCAN_REQUIRED_FOR_APPROVAL: ${MCP_SCAN_REQUIRED_FOR_APPROVAL:-0}
      OTEL_SERVICE_NAME: agent-service
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      gateway:
        condition: service_started
    networks: [edge, agent, data, telemetry, scanner]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  gateway-sse:
    build: ./gateway
    command: ["python", "-m", "app.sse_entry"]
    environment: *gateway-env
    depends_on:
      db:
        condition: service_healthy
      opa:
        condition: service_healthy
      mock-http-mcp:
        condition: service_started
    volumes:
      - effects:/runtime:ro
      - ./reports:/reports:ro
      - ./opa:/policy:ro
    networks: [policy, tools, data, telemetry]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # 제출된 저장소를 격리해서 복제·검사만 하는 워커. 저장소 코드는 실행하지 않고
  # Gateway와 파일시스템·네트워크를 공유하지 않는다. tools/policy 망에 붙이지
  # 않으므로 여기서 무엇이 실행돼도 MCP 실행 경로에는 닿지 않는다.
  intake-worker:
    build:
      context: ./supply_chain
      dockerfile: intake-worker.Dockerfile
    environment:
      DATABASE_URL: postgresql://mcp:${POSTGRES_PASSWORD:-demo-only-change-me}@db:5432/mcp_governance
      REPORT_DIR: /reports
      INTAKE_WORK_DIR: /work
      SEMGREP_RULES: /rules/semgrep-mcp.yml
      INTAKE_POLL_SECONDS: ${INTAKE_POLL_SECONDS:-5}
      # AI-Infra-Guard mcp-scan은 OpenAI 호환 endpoint가 있을 때만 돌아간다.
      # 비어 있으면 Console이 "실행할 수 없음"과 필요한 값을 그대로 보여준다.
      MCP_SCAN_API_KEY: ${MCP_SCAN_API_KEY:-}
      MCP_SCAN_BASE_URL: ${MCP_SCAN_BASE_URL:-}
      MCP_SCAN_MODEL: ${MCP_SCAN_MODEL:-}
      MCP_SCAN_LANGUAGE: ${MCP_SCAN_LANGUAGE:-en}
      MCP_SCAN_TIMEOUT: ${MCP_SCAN_TIMEOUT:-900}
      # 구조적 트리거와 lease. 감사가 "관리자가 기억날 때"가 아니라 정해진
      # 시점에 걸리게 하고, 워커가 죽어도 작업이 영구 RUNNING으로 남지 않게 한다.
      INTAKE_WORKER_ID: ${INTAKE_WORKER_ID:-intake-worker-1}
      MCP_SCAN_LEASE_SECONDS: ${MCP_SCAN_LEASE_SECONDS:-1200}
      MCP_SCAN_MAX_ATTEMPTS: ${MCP_SCAN_MAX_ATTEMPTS:-3}
      MCP_SCAN_AUTO_ON_VALIDATED: ${MCP_SCAN_AUTO_ON_VALIDATED:-1}
      MCP_SCAN_RESCAN_DAYS: ${MCP_SCAN_RESCAN_DAYS:-30}
      MCP_SCAN_RESCAN_SWEEP_SECONDS: ${MCP_SCAN_RESCAN_SWEEP_SECONDS:-900}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # 호스트 bind가 아니라 named volume을 쓴다. 워커는 비특권 uid로 돌고 호스트
      # reports/는 사용자 소유라 쓰기가 막히는데, 스캐너 출력이 조용히 사라지면
      # "증적 없는 검증 통과"가 만들어진다.
      - intake_reports:/reports
      - ./supply_chain/semgrep-mcp.yml:/rules/semgrep-mcp.yml:ro
      - intake_work:/work
      # 워크스페이스 스캔용 trivy_cache는 root 소유로 만들어져 있어 비특권 워커가
      # 쓸 수 없다. DB 캐시는 워커 전용 볼륨에 둔다.
      - intake_trivy_cache:/trivy-cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [data, scanner]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # 배선 확인 전용 OpenAI 호환 stub. 보안 판단을 하지 않으며 기본 기동에 없다.
  llm-stub:
    image: python:3.12-slim
    profiles: [llm-stub]
    command: ["python", "/app/llm_stub.py"]
    environment:
      LLM_STUB_PORT: "4010"
    volumes:
      - ./supply_chain/llm_stub.py:/app/llm_stub.py:ro
    networks: [scanner]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    command:
      - --set=receivers.otlp.protocols.grpc.endpoint=0.0.0.0:4317
      - --set=receivers.otlp.protocols.http.endpoint=0.0.0.0:4318
      - --set=extensions.jaeger_query.http.endpoint=0.0.0.0:16686
    ports:
      - "${BIND_ADDR:-127.0.0.1}:16686:16686"
    networks: [telemetry]

  syft:
    image: anchore/syft:v1.51.1
    profiles: [supply-chain]
    environment:
      SYFT_CHECK_FOR_APP_UPDATE: "false"
    command:
      - dir:/workspace/full_stack_lab
      - --source-name
      - mcp-gateway
      - --source-version
      - local-workspace
      - -o
      - cyclonedx-json=/reports/sbom.cdx.json
    volumes:
      - ..:/workspace:ro
      - ./reports:/reports
    network_mode: none

  trivy:
    image: aquasec/trivy:0.74.0
    profiles: [supply-chain]
    command:
      - fs
      - --scanners
      - vuln,misconfig,secret,license
      - --format
      - json
      - --output
      - /reports/trivy.json
      - --skip-dirs
      - /workspace/.git
      - /workspace/full_stack_lab
    volumes:
      - ..:/workspace:ro
      - ./reports:/reports
      - trivy_cache:/root/.cache/trivy
    networks: [scanner]

  semgrep:
    image: semgrep/semgrep:1.172.0
    profiles: [supply-chain]
    environment:
      SEMGREP_SEND_METRICS: "off"
    command:
      - semgrep
      - scan
      - --config
      - /rules/semgrep-mcp.yml
      - --json
      - --output
      - /reports/semgrep.json
      - /workspace/full_stack_lab
    volumes:
      - ..:/workspace:ro
      - ./reports:/reports
      - ./supply_chain/semgrep-mcp.yml:/rules/semgrep-mcp.yml:ro
    network_mode: none


networks:
  edge: {}
  agent:
    internal: true
  policy:
    internal: true
  tools:
    internal: true
  data:
    internal: true
  telemetry:
    internal: true
  scanner: {}

volumes:
  db_data: {}
  effects: {}
  trivy_cache: {}
  intake_work: {}
  intake_reports: {}
  intake_trivy_cache: {}
