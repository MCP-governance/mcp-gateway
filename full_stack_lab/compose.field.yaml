# 사내망 노출 오버라이드 — 실기기 배치 전용(docs/design/NETWORK.md, 루트 README
# "실제 기기로 배치하기"). `compose.yaml`은 그대로이고, 이 파일은
# `./console.sh field ...`(내부적으로 `docker compose -f compose.yaml -f compose.field.yaml`)
# 로 얹을 때만 적용된다. 기본 `./console.sh up`은 이 파일을 읽지 않는다. CI는 `verify` 끝에서
# 이 오버레이를 얹어 README의 실기기 절차를 그대로 돌린다(D-42).
#
# 게시하는 것은 Caddy와 모델 프록시뿐이다. `console.sh field`가 Tailscale IP를 찾아
# APPLIANCE_BIND로 넘긴다. 둘 다 tailnet의 암호화된 경로에만 바인딩한다(D-46·D-67).

services:
  db:
    volumes:
      - ${FIELD_DB_VOLUME:-field_db_data}:/var/lib/postgresql

  # 내부 Gitea의 신원은 솔루션 계정이다(D-48). Caddy가 솔루션 로그인을 확인하고 X-WEBAUTH-USER를 싣는다.
  # Gitea는 그 헤더를 Caddy의 고정 IP에서 온 것만 믿고, agent-service가 미리 만든 사용자만 받는다(자동 가입 없음).
  corp-git:
    environment:
      GITEA__server__ROOT_URL: https://${APPLIANCE_BIND}:443/git/
      GITEA__server__DISABLE_SSH: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
      GITEA__service__ENABLE_REVERSE_PROXY_AUTHENTICATION: "true"
      GITEA__service__ENABLE_REVERSE_PROXY_AUTO_REGISTRATION: "false"
      GITEA__service__ENABLE_PASSWORD_SIGNIN_FORM: "false"
      GITEA__service__SHOW_REGISTRATION_BUTTON: "false"
      GITEA__openid__ENABLE_OPENID_SIGNIN: "false"
      GITEA__security__REVERSE_PROXY_AUTHENTICATION_USER: X-WEBAUTH-USER
      GITEA__security__REVERSE_PROXY_TRUSTED_PROXIES: ${MCP_NET_PREFIX:-10.245}.1.250/32
      GITEA__security__REVERSE_PROXY_LIMIT: "1"
    volumes:
      - ${FIELD_GIT_VOLUME:-field_corp_git_data}:/var/lib/gitea

  caddy:
    image: caddy:2.11.4-alpine
    user: "${CONSOLE_CADDY_UID:-10001}:0"
    restart: unless-stopped
    depends_on:
      gateway: {condition: service_started}
      agent-service: {condition: service_started}
    ports:
      - "${APPLIANCE_BIND:?./console.sh field up을 사용하세요}:443:8080"
      # 인증서 방식이 none일 때만 콘솔을 제공하며, HTTPS를 켜면 이름 기반 주소로 리디렉트한다.
      - "${APPLIANCE_BIND:?./console.sh field up을 사용하세요}:8000:8081"
    environment:
      FIELD_TLS_ADDRESSES: ${FIELD_TLS_ADDRESSES:?./console.sh field up을 사용하세요}
      APPLIANCE_BIND: ${APPLIANCE_BIND}
      FIELD_CONSOLE_TLS: ${FIELD_CONSOLE_TLS:-none}
      FIELD_CONSOLE_NAME: ${FIELD_CONSOLE_NAME:-}
    volumes:
      - ./field/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./field/console:/etc/caddy/console:ro
      - field_caddy_data:/data
    networks:
      edge:
        # corp-git의 REVERSE_PROXY_TRUSTED_PROXIES와 같은 값. 다른 컨테이너는 Gitea에 신원 헤더를 실을 수 없다.
        ipv4_address: ${MCP_NET_PREFIX:-10.245}.1.250
    # 이미지의 caddy 바이너리는 파일 능력을 달고 있어 경계 집합에 이 능력이 없으면 실행되지 않는다.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

  # 관리형 엔드포인트 계정의 모델 API 경로(D-67). 엔드포인트 방화벽은 이 호스트의 게이트웨이·프록시 포트만 열어 두고,
  # 프록시는 model-domains.txt의 도메인만 허용한다(TLS 터널은 443만). Caddy처럼 Tailscale IP에만 게시한다.
  model-proxy:
    build: ./model-proxy
    image: mcpgw/model-proxy:1.0
    restart: unless-stopped
    ports:
      - "${APPLIANCE_BIND:?./console.sh field up을 사용하세요}:${MODEL_PROXY_PORT:-3128}:3128"
    networks: [edge]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

  # 사내망에서는 Gateway·IdP가 하네스에 알려 주는 절대 URL(RFC 9728 resource_metadata,
  # RFC 8414 authorization_servers, Console 리다이렉트)도 실제 호스트 이름이어야 한다.
  gateway:
    environment:
      MCP_FIELD_MODE: ${FIELD_ACCOUNTS_MODE:-1}
      ENDPOINT_TAILSCALE_NODE_ID: ${ENDPOINT_TAILSCALE_NODE_ID:-}
      ENDPOINT_GATEWAY_IPS: ${ENDPOINT_GATEWAY_IPS:-${APPLIANCE_BIND}}
      LOCAL_MANIFEST_PUBKEY: ${LOCAL_MANIFEST_PUBKEY:-}
      LOCAL_IMAGE_MIRRORS: ${LOCAL_IMAGE_MIRRORS:-}
      LOCAL_ENGINE_SETTINGS: ${LOCAL_ENGINE_SETTINGS:-}
      MODEL_PROXY_PORT: ${MODEL_PROXY_PORT:-3128}
      REGISTRY_DIR: ${FIELD_REGISTRY_DIR:-/registry-field}
      GATEWAY_PUBLIC_MCP_URL: https://${APPLIANCE_BIND}:443/mcp/
      FIELD_PUBLIC_NAME: ${FIELD_PUBLIC_NAME:-}
      GATEWAY_PUBLIC_URL: https://${APPLIANCE_BIND}:443
      CONSOLE_PUBLIC_URL: https://${APPLIANCE_BIND}:443/
      IDP_ISSUER: https://${APPLIANCE_BIND}:443
      # IDP_ISSUER는 PC에 알리는 공개 주소다. 컨테이너 안에서는 그 이름이 풀리지 않으므로 Gateway가 직접
      # IdP를 부를 때(논문 실험 E1~E3)는 내부 주소를 쓴다. 토큰의 iss는 URL이 아니라 상수라 판정은 그대로다.
      IDP_INTERNAL_URL: http://agent-service:8000
    volumes:
      - ./registry/field:/registry-field:ro
      - ${FIELD_DISPOSAL_VOLUME:-field_disposal_journal}:/disposal
      # 키트 판본(/api/health의 pc_kit_sha256)은 배포하는 키트 파일에서 읽는다.
      - ../endpoint-agent:/endpoint-kit:ro

  gateway-sse:
    environment:
      FIELD_PUBLIC_NAME: ${FIELD_PUBLIC_NAME:-}
      MCP_FIELD_MODE: ${FIELD_ACCOUNTS_MODE:-1}
      IDP_ISSUER: https://${APPLIANCE_BIND}:443
      GATEWAY_PUBLIC_URL: https://${APPLIANCE_BIND}:443
      ENDPOINT_TAILSCALE_NODE_ID: ${ENDPOINT_TAILSCALE_NODE_ID:-}
      ENDPOINT_GATEWAY_IPS: ${ENDPOINT_GATEWAY_IPS:-${APPLIANCE_BIND}}
      MODEL_PROXY_PORT: ${MODEL_PROXY_PORT:-3128}
      REGISTRY_DIR: ${FIELD_REGISTRY_DIR:-/registry-field}
    volumes:
      - ./registry/field:/registry-field:ro
      - ${FIELD_DISPOSAL_VOLUME:-field_disposal_journal}:/disposal

  agent-service:
    depends_on:
      corp-git: {condition: service_healthy}
    # 직원이 Console에서 PC 키트를 직접 받는다(/static/kit/mcpgw_pc.py). 관리자가 파일을 따로 전달하지 않는다.
    volumes:
      - ./registry/provenance-trust-keys.json:/provenance-trust-keys.json:ro
      - ${FIELD_DISPOSAL_VOLUME:-field_disposal_journal}:/disposal
      - ./field/pc/mcpgw_pc.py:/app/app/agent_static/kit/mcpgw_pc.py:ro
      - ../endpoint-agent:/endpoint-kit:ro
      - ./registry/field:/registry-field:ro
      - ./runtime/recipes:/runtime-recipes:ro
      - ./field/ca:/field-ca:ro
    environment:
      MCP_PROVENANCE_TRUST_KEYS_FILE: /provenance-trust-keys.json
      # 로그인·가입 시도 제한을 Caddy 주소 하나가 아니라 실제 접속 주소별로 센다. Caddy만 믿는다.
      FORWARDED_ALLOW_IPS: ${MCP_NET_PREFIX:-10.245}.1.250
      REGISTRY_DIR: ${FIELD_REGISTRY_DIR:-/registry-field}
      # D-188: 한 사람이 운영하는 현장 기본값. 0으로 끄면 서로 다른 관리자 요건이 그대로 돈다.
      ROOT_SOLO_APPROVAL: ${ROOT_SOLO_APPROVAL:-1}
      LOCAL_MANIFEST_PUBKEY: ${LOCAL_MANIFEST_PUBKEY:-}
      LOCAL_ENGINE_SETTINGS: ${LOCAL_ENGINE_SETTINGS:-}
      # 승인 화면에서 로컬 실행 매니페스트를 바로 서명한다. 오프라인 서명만 쓰면 비워 둔다.
      LOCAL_MANIFEST_PRIVATE_KEY: ${LOCAL_MANIFEST_PRIVATE_KEY:-}
      LOCAL_IMAGE_MIRRORS: ${LOCAL_IMAGE_MIRRORS:-}
      FIELD_CA_FILE: /field-ca/root.crt
      ENDPOINT_TAILSCALE_NODE_ID: ${ENDPOINT_TAILSCALE_NODE_ID:-}
      ENDPOINT_GATEWAY_IPS: ${ENDPOINT_GATEWAY_IPS:-${APPLIANCE_BIND}}
      MODEL_PROXY_PORT: ${MODEL_PROXY_PORT:-3128}
      IDP_ISSUER: https://${APPLIANCE_BIND}:443
      MCP_FIELD_MODE: ${FIELD_ACCOUNTS_MODE:-1}
      GITEA_ADMIN_URL: http://corp-git:3000
      GITEA_ADMIN_USER: ${GITEA_ADMIN_USER:-corpadmin}
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD:-corp-admin-lab-only}
      GITEA_PUBLIC_URL: https://${APPLIANCE_BIND}:443/git

  # 승인한 소스 MCP를 고정 레시피로 빌드·실행하는 유일한 프로세스(DEV-38, D-114). 엔진 소켓은 이 컨테이너만
  # 받는다. 게시 포트 없이 DB(data)와 내부 Git(ops)만 닿고, 실행한 MCP의 망에는 스스로 붙어 응답만 확인한다.
  runtime-worker:
    build: {context: ., dockerfile: runtime/Dockerfile}
    image: mcpgw/runtime-worker:1.0
    restart: unless-stopped
    environment:
      MCP_PROVENANCE_TRUST_KEYS_FILE: /provenance-trust-keys.json
      DATABASE_URL: postgresql://mcp:${POSTGRES_PASSWORD:-demo-only-change-me}@db:5432/mcp_governance
      REGISTRY_RUNTIME_DIR: /registry-runtime
      GITEA_ADMIN_URL: http://corp-git:3000
      GITEA_ADMIN_USER: ${GITEA_ADMIN_USER:-corpadmin}
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD:-corp-admin-lab-only}
      RUNTIME_WORKER_ID: ${RUNTIME_WORKER_ID:-runtime-worker-1}
      RUNTIME_SCAN_INTERVAL_SECONDS: ${RUNTIME_SCAN_INTERVAL_SECONDS:-86400}
      RUNTIME_CRITICAL_DEADLINE_DAYS: ${RUNTIME_CRITICAL_DEADLINE_DAYS:-7}
      RUNTIME_SCAN_TIMEOUT_SECONDS: ${RUNTIME_SCAN_TIMEOUT_SECONDS:-600}
      TRIVY_CACHE_DIR: /trivy-cache
    depends_on:
      db: {condition: service_healthy}
      corp-git: {condition: service_healthy}
    volumes:
      - ./registry/provenance-trust-keys.json:/provenance-trust-keys.json:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - registry_runtime:/registry-runtime:ro
      - runtime_trivy_cache:/trivy-cache
    tmpfs: [/work]
    networks: [data, ops, scanner]
    security_opt: ["no-new-privileges:true"]

  # 랩의 컨테이너 직원 PC 4대와 협력사 섀도 PC는 실기기 모드에서 기본으로 뜨지
  # 않는다(실제 PC가 대신한다). 같이 보고 싶으면 `--profile lab-workstations`
  # (`./console.sh field up --with-lab-workstations`). 기본 compose.yaml에는 이
  # profile이 없으므로 일반 `./console.sh up`은 그대로 네 대를 띄운다.
  ws-ysg: &field-workstation
    profiles: [lab-workstations]
    build:
      args:
        MANAGED_GATEWAY_URL: https://${APPLIANCE_BIND}/mcp
    environment:
      NODE_EXTRA_CA_CERTS: /field-ca/root.crt
      CODEX_CA_CERTIFICATE: /field-ca/root.crt
      GATEWAY_URL: https://${APPLIANCE_BIND}
      ENDPOINT_CA_FILE: /field-ca/root.crt
    volumes:
      - ./field/ca:/field-ca:ro
  ws-jwj: *field-workstation
  ws-pse: *field-workstation
  ws-nkk: *field-workstation

volumes:
  field_caddy_data: {}
  field_disposal_journal: {}
  field_lab_disposal_journal: {}
  runtime_trivy_cache: {}
  field_db_data: {}
  field_corp_git_data: {}
  field_lab_db_data: {}
  field_lab_corp_git_data: {}
